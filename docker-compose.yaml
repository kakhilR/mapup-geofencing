services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: mapup-postgres
    platform: linux/amd64
    environment:
      POSTGRES_DB: mapup
      POSTGRES_USER: mapup
      POSTGRES_PASSWORD: mapup_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mapup-backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://mapup:mapup_password@postgres:5432/mapup
      FRONTEND_URL: http://localhost:5173
    depends_on:
      - postgres


volumes:
  postgres_data: